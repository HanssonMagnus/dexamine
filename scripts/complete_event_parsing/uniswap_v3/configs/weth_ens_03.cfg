# Configuration for querying a specific contract

########################################################################################
# Changeable Variable
########################################################################################

# Name of exchange pair
POOL_NAME="weth_ens_03"

# Set the contract address
CONTRACT_ADDRESS="0x92560C178cE069CC014138eD3C2F5221Ba71f58a"

########################################################################################
# Set project data path
########################################################################################

# Project data path
BASE_DIR="/media/m2_front/research/data/dexamine"

########################################################################################
# Set paths for Trueblocks querying
########################################################################################

# Path to place Trueblocks parsing lists and logs
TRUEBLOCKS_DIR="trueblocks_lists/uniswap_v3/${POOL_NAME}"

# Path Python log
TRUEBLOCKS_LOG_FILE="${BASE_DIR}/${TRUEBLOCKS_DIR}/${POOL_NAME}.log"

# CSV output
TRUEBLOCKS_FILE_NAME="$(date +%Y-%m-%d)_${POOL_NAME}_positions"

TRUEBLOCKS_OUTPUT_FILE_CSV="${BASE_DIR}/${TRUEBLOCKS_DIR}/${TRUEBLOCKS_FILE_NAME}.csv"

# JSON output
TRUEBLOCKS_OUTPUT_FILE_JSON="${BASE_DIR}/${TRUEBLOCKS_DIR}/${TRUEBLOCKS_FILE_NAME}.json"

########################################################################################
# Set paths Dexamine Event Parsing
########################################################################################

# Path to place parsed event files and logs
DEXAMINE_DIR="${BASE_DIR}/uniswap_v3/${POOL_NAME}"

# Output file
DEXAMINE_OUTPUT_FILE="$DEXAMINE_DIR/events_${POOL_NAME}.parquet"

# Log file
DEXAMINE_LOG_FILE="$DEXAMINE_DIR/${POOL_NAME}.log"
