name: arXiv preprint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  paper:
    runs-on: ubuntu-latest
    name: Paper and recorded example
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install package
        run: python -m pip install .

      - name: Verify recorded example
        run: make -C paper check-example PYTHON=python

      - name: Install LaTeX
        run: |
          sudo apt-get update
          sudo apt-get install -y latexmk texlive-latex-extra texlive-fonts-recommended texlive-extra-utils

      - name: Build manuscript and submission files
        run: make -C paper bundle

      - name: Report manuscript word count
        run: make -C paper count

      - name: Verify arXiv source archive
        run: |
          python -m zipfile -e paper/submission/arxiv-source.zip /tmp/arxiv-source
          cd /tmp/arxiv-source
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          pdflatex -interaction=nonstopmode -halt-on-error paper.tex
          python -m zipfile -e anc/recorded-example.zip /tmp/arxiv-example
          cd /tmp/arxiv-example
          python examples/parse_recorded_transaction.py --check
          python examples/verify_recording.py

      - name: Upload submission files
        uses: actions/upload-artifact@v4
        with:
          name: arxiv-preprint
          path: |
            paper/submission/paper.pdf
            paper/submission/arxiv-source.zip
            paper/submission/recorded-example.zip
