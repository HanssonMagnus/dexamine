name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package (dev)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Black (format check)
        run: python -m black --check dexamine

      - name: Pylint (errors only)
        run: python -m pylint --errors-only dexamine

      - name: Mypy (strict)
        run: python -m mypy dexamine

      - name: Pytest
        run: python -m pytest dexamine/ -v
