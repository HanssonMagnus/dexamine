[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexamine"
version = "0.1.0"
description = "Examine DEX data from Ethereum archive nodes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "GPL-3.0" }
authors = [{ name = "Magnus Hansson", email = "hansson.carl.magnus@gmail.com" }]
dependencies = [
  "web3>=6.15.0",
  "pandas>=2.2.0",
  "eth-abi>=5.0.0",
  "pyarrow>=15.0.0",
  "polars>=1.11.0",
  "plotly>=5.24.1",
  "nbformat>=5.10.4",
  "requests>=2.31.0",
]

[project.optional-dependencies]
dev = [
  "black>=24.1.1",
  "mypy>=1.8.0",
  "pylint>=3.0.3",
  "pytest>=8.0.0",
  "types-requests>=2.31.0.20240125",
  "ipykernel>=6.29.5",
  "pre-commit>=3.6.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["dexamine*"]

[tool.setuptools.package-data]
dexamine = [
  "resources/abis/**/*.json",
  "resources/lists/*.txt",
  "tests/test_data/**/*",
]

[tool.black]
line-length = 88
target-version = ["py310"]
