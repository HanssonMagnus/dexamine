[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dexamine"
version = "1.0.0"
description = "Parse Uniswap v2/v3 events from Ethereum transaction receipt logs."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
authors = [{ name = "Magnus Hansson", email = "hansson.carl.magnus@gmail.com" }]
keywords = [
  "ethereum",
  "uniswap",
  "decentralized-exchange",
  "defi",
  "blockchain",
  "market-microstructure",
]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Financial and Insurance Industry",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Office/Business :: Financial",
  "Topic :: Scientific/Engineering :: Information Analysis",
  "Typing :: Typed",
]
dependencies = [
  "web3>=6.15.0",
  "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/HanssonMagnus/dexamine"
Repository = "https://github.com/HanssonMagnus/dexamine"
Documentation = "https://github.com/HanssonMagnus/dexamine/blob/main/docs/docs.md"
Issues = "https://github.com/HanssonMagnus/dexamine/issues"
Changelog = "https://github.com/HanssonMagnus/dexamine/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
  "black>=24.1.1",
  "mypy>=1.8.0",
  "pylint>=3.0.3",
  "pytest>=8.0.0",
  "types-requests>=2.31.0.20240125",
  "pre-commit>=3.6.0",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["dexamine*"]

[tool.setuptools.package-data]
dexamine = [
  "resources/abis/**/*.json",
  "tests/test_data/**/*",
]

[tool.black]
line-length = 88
target-version = ["py310"]
